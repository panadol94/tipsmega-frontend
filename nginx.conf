        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Next.js static export: check real exported files first. Unknown URLs
        # must return a genuine 404 instead of falling back to the homepage;
        # homepage fallbacks create duplicate "soft 404" pages in Google.
        location / {
            try_files $uri.html $uri/index.html $uri/ $uri =404;
        }

        # Cache static assets aggressively (PageSpeed fix)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|mp4|webm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            access_log off;
        }

        # Cache Next.js build chunks (hashed filenames = safe to cache forever)
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            access_log off;
        }

        # Custom error pages
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
