worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Basic optimization
    sendfile        on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers (SEO + security boost)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Next.js static export: check .html BEFORE directory match
        # This is critical because Next.js 16 creates both /blog/slug.html AND /blog/slug/ (RSC data)
        location / {
            try_files $uri.html $uri/index.html $uri/ $uri /index.html;
        }

        # Cache static assets aggressively (PageSpeed fix)
        location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|mp4|webm)$ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            access_log off;
        }

        # Cache Next.js build chunks (hashed filenames = safe to cache forever)
        location /_next/static/ {
            expires 1y;
            add_header Cache-Control "public, immutable, no-transform";
            access_log off;
        }

        # Custom error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
