name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify Deploy
        run: |
          curl -s -X POST "http://158.220.127.34:8000/api/v1/applications/osw4c00ksc4kcwocgscgw4ks/deploy" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_KEY }}"
